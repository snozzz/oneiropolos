name: Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Oneiropolos-Windows-x64
          path: |
            dist/windows/Oneiropolos-*.exe
            dist/windows/Oneiropolos-*.zip
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
